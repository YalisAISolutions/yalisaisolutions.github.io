<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- NEON CYAN GLOW FILTER -->
    <filter id="neonGlowFull" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- METALLIC CYAN GRADIENT -->
    <linearGradient id="cyanGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- BRIGHT ACCENT GRADIENT -->
    <linearGradient id="electricGradFull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- EMBLEM GRAPHIC GROUP -->
  <g transform="translate(150, 20) scale(1)" filter="url(#neonGlowFull)">
    
    <!-- LEFT V-WING / Y-ARM -->
    <polygon points="100,70 175,70 242,195 242,325 200,325 165,225 125,120" fill="url(#cyanGradFull)" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="miter" />

    <!-- RIGHT V-WING / Y-ARM -->
    <polygon points="400,70 325,70 258,195 258,325 300,325 335,225 375,120" fill="url(#cyanGradFull)" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="miter" />

    <!-- CENTER V-BOTTOM & Y-STEM -->
    <polygon points="250,380 205,305 238,305 250,330 262,305 295,305" fill="url(#electricGradFull)" stroke="#38bdf8" stroke-width="2" />

    <!-- TOP CENTER CHEVRON -->
    <polygon points="250,60 200,145 232,145 250,115 268,145 300,145" fill="url(#electricGradFull)" stroke="#06b6d4" stroke-width="2" />

    <!-- CORE INNER GLOW LINES -->
    <polyline points="135,90 245,270 245,340" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.95" />
    <polyline points="365,90 255,270 255,340" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.95" />
    <polyline points="250,75 250,180" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.95" />

  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g text-anchor="middle" filter="url(#neonGlowFull)">
    <!-- MAIN BRAND TEXT -->
    <text x="400" y="475" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="800" letter-spacing="10" fill="#ffffff">
      YALIS <tspan fill="#38bdf8">AI</tspan>
    </text>

    <!-- SUBTITLE TEXT -->
    <text x="400" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" letter-spacing="14" fill="#94a3b8">
      SOLUTIONS
    </text>
  </g>

  <!-- DECORATIVE ACCENT LINES -->
  <line x1="160" y1="470" x2="240" y2="470" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
  <line x1="560" y1="470" x2="640" y2="470" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
</svg>
