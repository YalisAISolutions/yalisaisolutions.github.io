<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- LIGHT BACKGROUND GRADIENT -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- SOLID BRAND GRADIENT -->
    <linearGradient id="solidBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND RECTANGLE -->
  <rect width="800" height="600" fill="url(#bgLight)" rx="16" stroke="#e2e8f0" stroke-width="2" />

  <!-- EMBLEM GRAPHIC GROUP (CENTERED AT X=400, Y=220) -->
  <g transform="translate(150, 20) scale(1)">
    
    <!-- LEFT V-WING / Y-ARM -->
    <polygon points="100,70 175,70 242,195 242,325 200,325 165,225 125,120" fill="url(#solidBrandGrad)" stroke="#0284c7" stroke-width="2" stroke-linejoin="miter" />

    <!-- RIGHT V-WING / Y-ARM -->
    <polygon points="400,70 325,70 258,195 258,325 300,325 335,225 375,120" fill="url(#solidBrandGrad)" stroke="#0284c7" stroke-width="2" stroke-linejoin="miter" />

    <!-- CENTER V-BOTTOM & Y-STEM -->
    <polygon points="250,380 205,305 238,305 250,330 262,305 295,305" fill="#0284c7" />

    <!-- TOP CENTER CHEVRON -->
    <polygon points="250,60 200,145 232,145 250,115 268,145 300,145" fill="#0284c7" />

    <!-- CORE INNER ACCENT LINES -->
    <polyline points="135,90 245,270 245,340" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.9" />
    <polyline points="365,90 255,270 255,340" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.9" />
    <polyline points="250,75 250,180" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.9" />

  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g text-anchor="middle">
    <!-- MAIN BRAND TEXT -->
    <text x="400" y="475" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="800" letter-spacing="10" fill="#0f172a">
      YALIS <tspan fill="#0284c7">AI</tspan>
    </text>

    <!-- SUBTITLE TEXT -->
    <text x="400" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" letter-spacing="14" fill="#475569">
      SOLUTIONS
    </text>
  </g>

  <!-- DECORATIVE ACCENT LINES -->
  <line x1="160" y1="470" x2="240" y2="470" stroke="#0284c7" stroke-width="2" opacity="0.6" />
  <line x1="560" y1="470" x2="640" y2="470" stroke="#0284c7" stroke-width="2" opacity="0.6" />
</svg>
